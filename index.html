<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trắc nghiệm DISC</title>
<meta name="description" content="Free DISC personality test in Vietnamese, English and Japanese, with detailed results and an AI coach. Trắc nghiệm DISC miễn phí. 無料DISC診断。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Be+Vietnam+Pro:wght@400;500;600&family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
/* Layout: one narrow column; the DISC quadrant (task/people × fast/careful) is the recurring visual anchor */
:root {
  --bg: #F2F4F7; --surface: #FFFFFF; --fg: #162033; --muted: #5A6477; --line: #DCE1E9;
  --ink: #162033; --ink-fg: #FFFFFF;
  --d: #CF4430; --i: #D99211; --s: #24935F; --c: #2E66CF;
  --d-soft: #FBE7E3; --i-soft: #FBF0D9; --s-soft: #DFF2E8; --c-soft: #E1EAFA;
  --display: "Bricolage Grotesque", "Be Vietnam Pro", system-ui, sans-serif;
  --body: "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", sans-serif;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
}
:root:lang(ja) {
  --display: "Noto Sans JP", "Hiragino Sans", "Yu Gothic", sans-serif;
  --body: "Noto Sans JP", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #10151F; --surface: #19202D; --fg: #E8ECF3; --muted: #A0AABB; --line: #2C3546;
    --ink: #E8ECF3; --ink-fg: #10151F;
    --d: #F0705C; --i: #F2B544; --s: #4CC48C; --c: #6C9BF5;
    --d-soft: #3A211E; --i-soft: #372C15; --s-soft: #17332A; --c-soft: #1B2944;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font-family: var(--body); font-size: 16px; line-height: 1.65;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 720px; margin: 0 auto; padding-block: 28px 64px; }
h1, h2, h3 { font-family: var(--display); line-height: 1.2; text-wrap: balance; margin: 0; }
h1 { font-size: clamp(2.1rem, 7vw, 3.3rem); font-weight: 800; letter-spacing: -0.02em; }
:lang(ja) h1 { letter-spacing: 0; font-weight: 700; }
h2 { font-size: clamp(1.45rem, 4.5vw, 1.95rem); font-weight: 700; }
h3 { font-size: 1.12rem; font-weight: 700; }
p { margin: 0; }
.muted { color: var(--muted); }
.eyebrow { font-size: 0.78rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.stack { display: flex; flex-direction: column; gap: 16px; }
.stack-lg { display: flex; flex-direction: column; gap: 28px; }
.row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }

.topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand { font-family: var(--display); font-weight: 800; font-size: 1.1rem; display: flex; align-items: center; gap: 8px; }
.brand .dots { display: grid; grid-template-columns: 8px 8px; gap: 2px; }
.brand .dots i { width: 8px; height: 8px; border-radius: 2px; display: block; }
.top-right { display: flex; gap: 8px; align-items: center; }
.langs { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 3px; background: var(--surface); }
.langs button { font: inherit; font-size: 0.82rem; font-weight: 600; border: 0; background: transparent; color: var(--muted); padding: 4px 10px; border-radius: 999px; cursor: pointer; }
.langs button[aria-pressed="true"] { background: var(--ink); color: var(--ink-fg); }
.account { flex-basis: 100%; display: flex; justify-content: flex-end; gap: 10px; font-size: 0.82rem; color: var(--muted); min-width: 0; }
.account span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.account a { color: var(--fg); font-weight: 600; }
.profile { max-width: 520px; }
.field { display: flex; flex-direction: column; gap: 6px; font-weight: 600; font-size: 0.95rem; }
.field input { font: inherit; font-weight: 400; padding: 12px 14px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--bg); color: var(--fg); width: 100%; }
.field input:focus-visible { outline: 3px solid var(--c); outline-offset: 1px; }
.field input[aria-invalid="true"] { border-color: var(--d); }
.field .err { color: var(--d); font-style: normal; font-weight: 400; font-size: 0.88rem; }

.btn { font: inherit; font-weight: 600; cursor: pointer; border-radius: 999px; padding: 12px 22px; border: 1.5px solid var(--ink); background: var(--ink); color: var(--ink-fg); transition: transform .12s ease; text-decoration: none; display: inline-block; }
.btn:hover { transform: translateY(-1px); }
.btn:disabled { opacity: .35; cursor: not-allowed; transform: none; }
.btn.ghost { background: transparent; color: var(--fg); border-color: var(--line); }
.btn.small { padding: 7px 14px; font-size: 0.88rem; }
.btn:focus-visible, .opt:focus-visible, .mode:focus-visible, .chip:focus-visible, .langs button:focus-visible, textarea:focus-visible { outline: 3px solid var(--c); outline-offset: 2px; }

.hero { display: grid; grid-template-columns: 1fr 240px; gap: 32px; align-items: center; }
.hero .lead { font-size: 1.05rem; color: var(--muted); max-width: 48ch; }
.quad-svg { width: 100%; max-width: 260px; height: auto; display: block; margin: 0 auto; }
.modes { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.mode { font: inherit; text-align: left; cursor: pointer; padding: 16px 18px; border-radius: 14px; border: 1.5px solid var(--line); background: var(--surface); color: var(--fg); display: flex; flex-direction: column; gap: 2px; transition: border-color .12s; }
.mode:hover { border-color: var(--fg); }
.mode strong { font-family: var(--display); font-size: 1.1rem; }
.mode span { font-size: 0.88rem; color: var(--muted); }
.mode.primary { background: var(--ink); color: var(--ink-fg); border-color: var(--ink); }
.mode.primary span { color: var(--ink-fg); opacity: .75; }
.facts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.facts div { background: var(--surface); padding: 14px 16px; }
.facts b { font-family: var(--display); font-size: 1.5rem; display: block; line-height: 1.1; font-variant-numeric: tabular-nums; }
.facts span { font-size: 0.85rem; color: var(--muted); }
.types { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
.type-chip { display: flex; gap: 12px; align-items: flex-start; padding: 14px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); }
.letter { font-family: "Bricolage Grotesque", sans-serif; font-weight: 800; font-size: 1.3rem; width: 40px; height: 40px; flex: none; border-radius: 10px; display: grid; place-items: center; color: var(--ink-fg); }
.type-chip p { font-size: 0.9rem; color: var(--muted); }
.type-chip strong { display: block; color: var(--fg); }
.howto { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px; }
.howto ul { margin: 8px 0 0; padding-left: 20px; }
.howto li { margin-block: 4px; }

.progress { display: flex; gap: 2px; }
.progress i { flex: 1; height: 6px; border-radius: 3px; background: var(--line); display: block; }
.progress i.done { background: var(--fg); }
.progress i.cur { background: var(--muted); }
.qmeta { display: flex; justify-content: space-between; gap: 12px; font-size: 0.9rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.qtext { font-size: clamp(1.3rem, 4.2vw, 1.7rem); }
.opts { display: flex; flex-direction: column; gap: 10px; }
.opts.words { display: grid; grid-template-columns: 1fr 1fr; }
.opt { font: inherit; text-align: left; cursor: pointer; width: 100%; display: flex; gap: 14px; align-items: center; padding: 16px 18px; border-radius: 14px; border: 1.5px solid var(--line); background: var(--surface); color: var(--fg); transition: border-color .12s, transform .12s; }
.opts.words .opt { font-family: var(--display); font-size: 1.15rem; font-weight: 600; padding-block: 20px; }
.opt:hover { border-color: var(--muted); transform: translateX(2px); }
.opt .k { font-family: var(--body); font-size: 0.8rem; font-weight: 600; width: 26px; height: 26px; flex: none; border-radius: 50%; border: 1.5px solid var(--line); display: grid; place-items: center; color: var(--muted); }
.opt.sel { border-color: var(--fg); box-shadow: inset 0 0 0 1px var(--fg); }
.opt.sel .k { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.hint { font-size: 0.85rem; color: var(--muted); }

.result-head { display: grid; grid-template-columns: 1fr 220px; gap: 28px; align-items: center; }
.big-type { display: flex; align-items: center; gap: 16px; }
.big-type .letter { width: 72px; height: 72px; font-size: 2.6rem; border-radius: 18px; }
.bars { display: flex; flex-direction: column; gap: 10px; }
.bar { display: grid; grid-template-columns: 130px 1fr 48px; gap: 12px; align-items: center; font-size: 0.92rem; }
.bar .track { height: 12px; background: var(--line); border-radius: 6px; overflow: hidden; }
.bar .fill { height: 100%; border-radius: 6px; transition: width .8s cubic-bezier(.2,.8,.2,1); }
.bar b { text-align: right; font-variant-numeric: tabular-nums; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 22px; }
.panel.tint { border: 0; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.grid2 > * { min-width: 0; }
.list { margin: 0; padding-left: 20px; }
.list li { margin-block: 5px; }
.tags { display: flex; flex-wrap: wrap; gap: 8px; }
.tag { font-size: 0.85rem; padding: 4px 12px; border-radius: 999px; background: var(--bg); border: 1px solid var(--line); }
.others { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.others .panel { padding: 16px; }
.others p { font-size: 0.9rem; color: var(--muted); }
.note { font-size: 0.85rem; color: var(--muted); border-top: 1px solid var(--line); padding-top: 16px; }
.toast { font-size: 0.9rem; color: var(--s); }
.shared-banner { background: var(--c-soft); border-radius: 12px; padding: 12px 16px; font-size: 0.95rem; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; justify-content: space-between; }

/* AI chat */
.chat { border: 1.5px solid var(--fg); }
.chat-head { display: flex; gap: 12px; align-items: flex-start; }
.chat-head .spark { width: 40px; height: 40px; flex: none; border-radius: 12px; background: var(--ink); color: var(--ink-fg); display: grid; place-items: center; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { font: inherit; font-size: 0.88rem; cursor: pointer; padding: 6px 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); text-align: left; }
.chip:hover { border-color: var(--fg); }
.msgs { display: flex; flex-direction: column; gap: 12px; max-height: 520px; overflow-y: auto; }
.msgs:empty { display: none; }
.msg { max-width: 92%; padding: 12px 16px; border-radius: 14px; font-size: 0.97rem; overflow-wrap: anywhere; }
.msg.user { align-self: flex-end; background: var(--ink); color: var(--ink-fg); border-bottom-right-radius: 4px; white-space: pre-wrap; }
.msg.ai { align-self: flex-start; background: var(--bg); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
.msg.ai p + p, .msg.ai p + ul, .msg.ai ul + p, .msg.ai ol + p, .msg.ai p + ol { margin-top: 8px; }
.msg.ai ul, .msg.ai ol { margin: 0; padding-left: 20px; }
.msg.ai h4 { margin: 8px 0 4px; font-size: 1rem; }
.msg.err { align-self: stretch; background: var(--d-soft); border-radius: 10px; font-size: 0.9rem; }
.typing { color: var(--muted); font-size: 0.9rem; }
.chat-form { display: flex; gap: 10px; align-items: flex-end; }
.chat-form textarea { flex: 1; min-width: 0; font: inherit; font-size: 0.97rem; padding: 12px 14px; border-radius: 14px; border: 1.5px solid var(--line); background: var(--bg); color: var(--fg); resize: none; min-height: 50px; max-height: 160px; }
.offline { font-size: 0.88rem; color: var(--muted); background: var(--i-soft); padding: 10px 14px; border-radius: 10px; }

.screen { animation: rise .35s ease both; }
@keyframes rise { from { transform: translateY(8px); } to { transform: none; } }
@media (prefers-reduced-motion: reduce) { .screen { animation: none; } .bar .fill, .opt, .btn, .mode { transition: none; } }

@media (max-width: 640px) {
  .hero, .result-head { grid-template-columns: 1fr; }
  .hero .quad-svg { max-width: 190px; order: -1; margin: 0; }
  .result-head .quad-svg { max-width: 220px; }
  .types, .grid2, .others, .modes { grid-template-columns: 1fr; }
  .bar { grid-template-columns: 100px 1fr 44px; }
  .opts.words { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<div class="wrap" id="app" aria-live="polite"></div>
<script src="js/config.js"></script>
<script src="js/i18n.js"></script>
<script src="js/questions.js"></script>
<script src="js/app.js"></script>
</body>
</html>
